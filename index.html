const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.s), iterations:P.i, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.v)}, key, b64(P.d));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open(); document.write(html); document.close();
}
const f=document.getElementById("f"), err=document.getElementById("err"), go=document.getElementById("go");
f.addEventListener("submit", async e => {
  e.preventDefault();
  const pw=document.getElementById("pw").value; if(!pw) return;
  go.disabled=true; err.textContent=""; go.textContent="Открываю…";
  try{ await unlock(pw);
       try{ (document.getElementById("rem")?.checked!==false ? localStorage : sessionStorage).setItem("am-pw", pw); }catch(_){} }
  catch(_){ err.textContent="Неверный пароль."; go.disabled=false; go.textContent="Открыть"; }
});
try{ const s=localStorage.getItem("am-pw")||sessionStorage.getItem("am-pw");
     if(s){ go.disabled=true; go.textContent="Открываю…";
       unlock(s).catch(()=>{ try{localStorage.removeItem("am-pw");sessionStorage.removeItem("am-pw")}catch(_){} go.disabled=false; go.textContent="Открыть"; }); } }catch(_){}
</script>
